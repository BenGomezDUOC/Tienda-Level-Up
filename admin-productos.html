<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Administrativo — Gestión de Productos | Level-Up Gamer</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-root="" data-page="admin">

  <header id="lug-header"></header>

  <main class="seccion">
    <div class="contenedor">
      <!-- Encabezado de Administración -->
      <div class="panel-admin-header">
        <div>
          <span class="badge" style="background: rgba(57, 255, 20, 0.15); color: var(--verde); margin-bottom: 0.4rem;">
            ⚙️ MÓDULO ADMINISTRATIVO (EV1)
          </span>
          <h1>Gestión de Productos</h1>
          <p>Crea, edita y elimina productos del catálogo en tiempo real con persistencia en localStorage.</p>
        </div>
        <div style="display: flex; gap: 0.8rem;">
          <button onclick="abrirModalCrear()" class="btn btn-accent" type="button">
            ➕ Agregar Nuevo Producto
          </button>
          <button onclick="restaurarCatalogoBase()" class="btn btn-outline btn-sm" type="button">
            🔄 Restaurar Base de Fábrica
          </button>
        </div>
      </div>

      <!-- Pestañas de Navegación del Panel Admin -->
      <div class="tabs-admin">
        <a href="admin-productos.html" class="tab-admin activo">🎮 Catálogo de Productos</a>
        <a href="admin-usuarios.html" class="tab-admin">👥 Usuarios Registrados</a>
      </div>

      <!-- Barra de Búsqueda Admin -->
      <div class="filtros-barra" style="margin-bottom: 1.5rem;">
        <div class="campo" style="margin: 0; min-width: 250px;">
          <input type="search" id="admin-buscar" placeholder="🔍 Buscar por código, nombre o categoría..." oninput="filtrarTablaProductos()">
        </div>
        <div style="margin-left: auto; font-size: 0.85rem; color: var(--texto-tenue);" id="admin-prod-contador">
          <!-- Total contador -->
        </div>
      </div>

      <!-- Tabla de Productos -->
      <div style="overflow-x: auto;">
        <table class="tabla-admin">
          <thead>
            <tr>
              <th>Código</th>
              <th>Ícono</th>
              <th>Nombre del Producto</th>
              <th>Categoría</th>
              <th>Precio CLP</th>
              <th>Stock</th>
              <th>Fabricante</th>
              <th style="text-align: right;">Acciones</th>
            </tr>
          </thead>
          <tbody id="admin-tabla-body">
            <!-- Filas inyectadas dinámicamente por JS -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal para Crear / Editar Producto -->
  <div class="modal-fondo" id="modal-producto">
    <div class="modal-caja">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem;">
        <h2 id="modal-prod-titulo" style="font-size: 1.3rem; margin: 0;">Agregar Producto</h2>
        <button onclick="cerrarModalProducto()" class="btn btn-ghost btn-sm" type="button" style="font-size: 1.2rem;">✕</button>
      </div>

      <form id="form-producto" onsubmit="guardarProducto(event)" novalidate>
        <input type="hidden" id="prod-modo" value="crear">

        <div class="fila-2">
          <!-- Código -->
          <div class="campo">
            <label for="prod-codigo">Código *</label>
            <input type="text" id="prod-codigo" placeholder="Ej: JM003" required style="text-transform: uppercase;">
            <span class="mensaje-error" data-error-for="prod-codigo"></span>
          </div>

          <!-- Ícono Emoji -->
          <div class="campo">
            <label for="prod-icono">Ícono (Emoji) *</label>
            <input type="text" id="prod-icono" placeholder="Ej: 🎮" value="🎮" required>
            <span class="mensaje-error" data-error-for="prod-icono"></span>
          </div>
        </div>

        <!-- Nombre -->
        <div class="campo">
          <label for="prod-nombre">Nombre del Producto *</label>
          <input type="text" id="prod-nombre" placeholder="Ej: Mouse Gamer Inalámbrico" required>
          <span class="mensaje-error" data-error-for="prod-nombre"></span>
        </div>

        <!-- Categoría -->
        <div class="campo">
          <label for="prod-categoria">Categoría *</label>
          <select id="prod-categoria" required>
            <!-- Inyectado por JS -->
          </select>
          <span class="mensaje-error" data-error-for="prod-categoria"></span>
        </div>

        <div class="fila-2">
          <!-- Precio -->
          <div class="campo">
            <label for="prod-precio">Precio CLP *</label>
            <input type="number" id="prod-precio" placeholder="29990" min="100" required>
            <span class="mensaje-error" data-error-for="prod-precio"></span>
          </div>

          <!-- Stock -->
          <div class="campo">
            <label for="prod-stock">Stock Disponible *</label>
            <input type="number" id="prod-stock" placeholder="15" min="0" required>
            <span class="mensaje-error" data-error-for="prod-stock"></span>
          </div>
        </div>

        <!-- Fabricante -->
        <div class="campo">
          <label for="prod-fabricante">Fabricante / Distribuidor *</label>
          <input type="text" id="prod-fabricante" placeholder="Ej: Logitech, Sony, Devir..." required>
          <span class="mensaje-error" data-error-for="prod-fabricante"></span>
        </div>

        <!-- Descripción -->
        <div class="campo">
          <label for="prod-desc">Descripción Detallada *</label>
          <textarea id="prod-desc" rows="3" placeholder="Características técnicas y uso recomendado..." required style="width: 100%; padding: 0.8rem; background: rgba(255,255,255,0.05); border: 1px solid var(--borde-fuerte); border-radius: var(--radio-chico); color: var(--texto); font-family: var(--fuente-texto);"></textarea>
          <span class="mensaje-error" data-error-for="prod-desc"></span>
        </div>

        <div style="display: flex; gap: 0.8rem; justify-content: flex-end; margin-top: 1.5rem;">
          <button type="button" onclick="cerrarModalProducto()" class="btn btn-outline btn-sm">Cancelar</button>
          <button type="submit" class="btn btn-primary btn-sm" id="btn-submit-prod">Guardar Producto 💾</button>
        </div>
      </form>
    </div>
  </div>

  <footer id="lug-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/validations.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/reviews.js"></script>
  <script src="js/nav.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      poblarSelectCategorias();
      renderizarTablaProductos();
    });

    function poblarSelectCategorias() {
      const sel = document.getElementById("prod-categoria");
      sel.innerHTML = LUG_CATEGORIES.map(c => `
        <option value="${c.id}">${c.icono} ${c.nombre}</option>
      `).join("");
    }

    function renderizarTablaProductos(filtro = "") {
      let productos = lugGetProducts();
      if (filtro) {
        const q = filtro.toLowerCase();
        productos = productos.filter(p => 
          p.codigo.toLowerCase().includes(q) ||
          p.nombre.toLowerCase().includes(q) ||
          p.categoria.toLowerCase().includes(q) ||
          p.fabricante.toLowerCase().includes(q)
        );
      }

      document.getElementById("admin-prod-contador").textContent = 
        `Mostrando ${productos.length} producto${productos.length === 1 ? "" : "s"}`;

      const tbody = document.getElementById("admin-tabla-body");
      if (productos.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center" style="padding: 2rem; color: var(--texto-tenue);">No se encontraron productos coincidentes.</td></tr>`;
        return;
      }

      tbody.innerHTML = productos.map(p => `
        <tr>
          <td><code>${p.codigo}</code></td>
          <td style="font-size: 1.4rem;">${p.icono}</td>
          <td><strong>${p.nombre}</strong></td>
          <td>${lugGetCategoryName(p.categoria)}</td>
          <td style="font-family: var(--fuente-titulo); color: var(--azul);">${lugFormatCLP(p.precio)}</td>
          <td>
            <span style="color: ${p.stock > 5 ? "var(--verde)" : (p.stock > 0 ? "orange" : "var(--error)")}; font-weight: bold;">
              ${p.stock} un.
            </span>
          </td>
          <td>${p.fabricante}</td>
          <td style="text-align: right;">
            <div class="acciones-tabla" style="justify-content: flex-end;">
              <button onclick="abrirModalEditar('${p.codigo}')" class="btn btn-outline btn-sm" title="Editar Producto">✏️</button>
              <button onclick="eliminarProducto('${p.codigo}')" class="btn btn-danger btn-sm" title="Eliminar Producto">🗑️</button>
            </div>
          </td>
        </tr>
      `).join("");
    }

    function filtrarTablaProductos() {
      const q = document.getElementById("admin-buscar").value.trim();
      renderizarTablaProductos(q);
    }

    function abrirModalCrear() {
      document.getElementById("modal-prod-titulo").textContent = "Agregar Nuevo Producto";
      document.getElementById("prod-modo").value = "crear";
      document.getElementById("prod-codigo").readOnly = false;
      document.getElementById("prod-codigo").value = "";
      document.getElementById("prod-nombre").value = "";
      document.getElementById("prod-precio").value = "";
      document.getElementById("prod-stock").value = "10";
      document.getElementById("prod-fabricante").value = "";
      document.getElementById("prod-desc").value = "";
      document.getElementById("prod-icono").value = "🎮";
      limpiarErroresModal();
      document.getElementById("modal-producto").classList.add("visible");
    }

    function abrirModalEditar(codigo) {
      const p = lugGetProductByCode(codigo);
      if (!p) return;

      document.getElementById("modal-prod-titulo").textContent = `Editar Producto (${p.codigo})`;
      document.getElementById("prod-modo").value = "editar";
      document.getElementById("prod-codigo").value = p.codigo;
      document.getElementById("prod-codigo").readOnly = true; // el código no se edita para integridad
      document.getElementById("prod-nombre").value = p.nombre;
      document.getElementById("prod-categoria").value = p.categoria;
      document.getElementById("prod-precio").value = p.precio;
      document.getElementById("prod-stock").value = p.stock;
      document.getElementById("prod-fabricante").value = p.fabricante;
      document.getElementById("prod-desc").value = p.descripcion;
      document.getElementById("prod-icono").value = p.icono;
      limpiarErroresModal();
      document.getElementById("modal-producto").classList.add("visible");
    }

    function cerrarModalProducto() {
      document.getElementById("modal-producto").classList.remove("visible");
    }

    function limpiarErroresModal() {
      lugSetFieldError("prod-codigo", "");
      lugSetFieldError("prod-nombre", "");
      lugSetFieldError("prod-precio", "");
      lugSetFieldError("prod-stock", "");
      lugSetFieldError("prod-fabricante", "");
      lugSetFieldError("prod-desc", "");
    }

    function guardarProducto(e) {
      e.preventDefault();
      limpiarErroresModal();

      const modo = document.getElementById("prod-modo").value;
      const codigo = document.getElementById("prod-codigo").value.trim().toUpperCase();
      const nombre = document.getElementById("prod-nombre").value.trim();
      const categoria = document.getElementById("prod-categoria").value;
      const precio = Number(document.getElementById("prod-precio").value);
      const stock = Number(document.getElementById("prod-stock").value);
      const fabricante = document.getElementById("prod-fabricante").value.trim();
      const desc = document.getElementById("prod-desc").value.trim();
      const icono = document.getElementById("prod-icono").value.trim() || "🎮";

      let valido = true;

      if (!codigo || codigo.length < 3) {
        lugSetFieldError("prod-codigo", "Código requerido (mín. 3 caracteres).");
        valido = false;
      }
      if (!nombre || nombre.length < 3) {
        lugSetFieldError("prod-nombre", "Nombre requerido (mín. 3 caracteres).");
        valido = false;
      }
      if (isNaN(precio) || precio <= 0) {
        lugSetFieldError("prod-precio", "Ingresa un precio mayor a 0.");
        valido = false;
      }
      if (isNaN(stock) || stock < 0) {
        lugSetFieldError("prod-stock", "El stock debe ser 0 o superior.");
        valido = false;
      }
      if (!fabricante) {
        lugSetFieldError("prod-fabricante", "Ingresa el fabricante o distribuidor.");
        valido = false;
      }
      if (!desc || desc.length < 10) {
        lugSetFieldError("prod-desc", "La descripción debe tener al menos 10 caracteres.");
        valido = false;
      }

      if (!valido) return;

      let productos = lugGetProducts();

      if (modo === "crear") {
        if (productos.some(p => p.codigo.toUpperCase() === codigo)) {
          lugSetFieldError("prod-codigo", "Ya existe un producto con este código.");
          return;
        }
        productos.push({
          codigo,
          categoria,
          nombre,
          precio,
          stock,
          rating: 5.0,
          descripcion: desc,
          fabricante,
          icono
        });
      } else {
        const idx = productos.findIndex(p => p.codigo.toUpperCase() === codigo);
        if (idx !== -1) {
          productos[idx] = {
            ...productos[idx],
            categoria,
            nombre,
            precio,
            stock,
            fabricante,
            descripcion: desc,
            icono
          };
        }
      }

      lugSaveProducts(productos);
      cerrarModalProducto();
      renderizarTablaProductos();
      alert(`Producto "${nombre}" ${modo === "crear" ? "agregado" : "actualizado"} exitosamente.`);
    }

    function eliminarProducto(codigo) {
      if (confirm(`¿Estás seguro de que deseas eliminar el producto ${codigo}?`)) {
        let productos = lugGetProducts().filter(p => p.codigo !== codigo);
        lugSaveProducts(productos);
        renderizarTablaProductos();
      }
    }

    function restaurarCatalogoBase() {
      if (confirm("¿Deseas restablecer el catálogo a los productos originales de fábrica? Se conservarán los datos de la pauta.")) {
        localStorage.setItem(LUG_KEYS.PRODUCTS, JSON.stringify(LUG_PRODUCTS_BASE));
        renderizarTablaProductos();
        alert("Catálogo restablecido exitosamente.");
      }
    }
  </script>
</body>
</html>
