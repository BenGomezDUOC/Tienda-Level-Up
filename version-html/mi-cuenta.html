<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Cuenta y Gamificación — Level-Up Gamer</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-root="" data-page="cuenta">

  <header id="lug-header"></header>

  <main class="seccion">
    <div class="contenedor" id="cuenta-contenedor">
      <!-- Carga dinámica -->
      <div class="text-center" style="padding: 3rem 0;">
        <p>Cargando información del usuario...</p>
      </div>
    </div>
  </main>

  <footer id="lug-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/validations.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/reviews.js"></script>
  <script src="js/nav.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderizarCuenta();
    });

    function renderizarCuenta() {
      const usuario = lugUsuarioActual();
      const cont = document.getElementById("cuenta-contenedor");

      if (!usuario) {
        cont.innerHTML = `
          <div class="resultado-vacio" style="max-width: 600px; margin-inline: auto;">
            <span style="font-size: 3.5rem; display: block; margin-bottom: 0.5rem;">🔒</span>
            <h2>Acceso Restringido</h2>
            <p>Debes iniciar sesión para ver tu perfil, tus Puntos LevelUp y tus beneficios exclusivos.</p>
            <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 1.5rem;">
              <a href="login.html" class="btn btn-primary">Iniciar Sesión</a>
              <a href="registro.html" class="btn btn-outline">Crear Cuenta</a>
            </div>
          </div>`;
        return;
      }

      const puntos = usuario.puntosLevelUp || 0;
      const nivel = lugNivelPorPuntos(puntos);
      const cuponActivo = JSON.parse(sessionStorage.getItem("lug_cupon_puntos"));

      // Calcular progreso al siguiente nivel
      let sigNivelMin = 100;
      if (puntos >= 700) sigNivelMin = 1000;
      else if (puntos >= 300) sigNivelMin = 700;
      else if (puntos >= 100) sigNivelMin = 300;

      const pctProgreso = Math.min(Math.round((puntos / sigNivelMin) * 100), 100);

      cont.innerHTML = `
        <div class="seccion-titulo">
          <div>
            <h1>Hola, ${usuario.nombre} 👋</h1>
            <p>Gestiona tu perfil, comparte tu código de referido y canjea tus Puntos LevelUp.</p>
          </div>
          <button onclick="cerrarSesionMiCuenta()" class="btn btn-danger btn-sm" type="button">Cerrar Sesión</button>
        </div>

        <!-- Tarjeta de Gamificación y Nivel -->
        <div class="nivel-tarjeta">
          <div class="nivel-icono">${nivel.icono}</div>
          <div style="flex: 1;">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
              <div>
                <span class="badge">NIVEL ACTUAL</span>
                <h2 style="margin: 0.3rem 0 0.1rem; color: var(--verde);">${nivel.nombre}</h2>
              </div>
              <div class="text-right">
                <span style="font-family: var(--fuente-titulo); font-size: 1.8rem; color: var(--azul);">${puntos}</span>
                <span style="font-size: 0.85rem; color: var(--texto-tenue);"> Puntos LevelUp</span>
              </div>
            </div>

            <div class="barra-progreso">
              <div style="width: ${pctProgreso}%;"></div>
            </div>
            <div style="font-size: 0.78rem; color: var(--texto-tenue); margin-top: 0.3rem; text-align: right;">
              Progreso al siguiente nivel: ${puntos} / ${sigNivelMin} pts (${pctProgreso}%)
            </div>
          </div>
        </div>

        <div class="hero-grid" style="align-items: start; gap: 2rem;">
          <!-- Bloque Izquierdo: Referidos y Canje -->
          <div>
            <!-- Código de Referido -->
            <div class="tarjeta-formulario" style="margin-bottom: 1.5rem;">
              <h3>🎁 Tu Código de Referido</h3>
              <p style="font-size: 0.9rem;">Comparte este código con tus amigos al registrarse. Ellos ganarán <strong>20 pts</strong> de bienvenida y tú recibirás <strong>50 Puntos LevelUp</strong> por cada referido.</p>
              
              <div style="display: flex; gap: 0.8rem; align-items: center; margin-top: 1rem;">
                <span class="codigo-referido">${usuario.codigoReferido}</span>
                <button onclick="copiarCodigo('${usuario.codigoReferido}')" class="btn btn-outline btn-sm">📋 Copiar Código</button>
              </div>
            </div>

            <!-- Canje de Puntos -->
            <div class="tarjeta-formulario">
              <h3>🪙 Canjear Puntos por Descuentos</h3>
              <p style="font-size: 0.9rem;">Cada <strong>100 Puntos LevelUp</strong> se pueden canjear por un <strong>5% de descuento adicional</strong> acumulable en el carrito (hasta un tope de 20%).</p>
              
              ${cuponActivo && cuponActivo.usuario === usuario.email ? `
                <div class="alerta alerta-exito visible" style="margin-top: 1rem;">
                  🎉 ¡Cupón del ${cuponActivo.porcentaje}% de descuento activo en tu carrito actual!
                </div>
              ` : ''}

              <button onclick="procesarCanjePuntos()" class="btn btn-accent btn-full" style="margin-top: 1rem;" ${puntos < 100 ? 'disabled' : ''}>
                ${puntos < 100 ? 'Necesitas al menos 100 Puntos para canjear' : 'Canjear 100 Puntos (5% OFF)'}
              </button>
            </div>
          </div>

          <!-- Bloque Derecho: Información Personal y Preferencias -->
          <div class="tarjeta-formulario">
            <h3>👤 Información Personal</h3>
            <form id="form-perfil" onsubmit="actualizarPerfil(event)">
              <div class="campo">
                <label>Correo Registrado</label>
                <input type="text" value="${usuario.email}" disabled style="opacity: 0.7;">
                ${usuario.descuentoDuoc ? '<span class="badge" style="margin-top:0.4rem; background:rgba(57,255,20,0.15); color:var(--verde);">🎓 20% Descuento Duoc Activo</span>' : ''}
              </div>

              <div class="campo">
                <label for="perf-nombre">Nombre Completo</label>
                <input type="text" id="perf-nombre" value="${usuario.nombre}" required>
              </div>

              <div class="campo">
                <label for="perf-fecha">Fecha de Nacimiento</label>
                <input type="date" id="perf-fecha" value="${usuario.fechaNacimiento}" required>
              </div>

              <div class="campo">
                <label>Categorías Preferidas de Compra</label>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 0.4rem;">
                  ${LUG_CATEGORIES.map(c => `
                    <label style="font-weight:400; font-size:0.85rem; cursor:pointer;">
                      <input type="checkbox" name="pref-cat" value="${c.id}" ${usuario.preferencias && usuario.preferencias.categoriasFavoritas.includes(c.id) ? 'checked' : ''}>
                      ${c.icono} ${c.nombre}
                    </label>
                  `).join("")}
                </div>
              </div>

              <div id="alerta-perfil" class="alerta"></div>

              <button type="submit" class="btn btn-primary btn-full" style="margin-top: 1rem;">Guardar Cambios 💾</button>
            </form>
          </div>
        </div>
      `;
    }

    function copiarCodigo(codigo) {
      navigator.clipboard.writeText(codigo).then(() => {
        alert(`¡Código ${codigo} copiado al portapapeles! Compártelo con tus amigos.`);
      }).catch(() => {
        alert(`Tu código de referido es: ${codigo}`);
      });
    }

    function procesarCanjePuntos() {
      const usuario = lugUsuarioActual();
      if (!usuario) return;

      const res = lugCanjearPuntos(usuario.email);
      if (res.ok) {
        // Guardar cupón en sessionStorage para aplicar en el carrito
        sessionStorage.setItem("lug_cupon_puntos", JSON.stringify({
          usuario: usuario.email,
          porcentaje: res.descuentoPorcentaje
        }));
        alert(`¡Canje exitoso! Obtuviste un cupón del ${res.descuentoPorcentaje}% de descuento para tu carrito. Puntos restantes: ${res.puntosRestantes}`);
        renderizarCuenta();
      } else {
        alert(res.error);
      }
    }

    function actualizarPerfil(e) {
      e.preventDefault();
      const usuario = lugUsuarioActual();
      if (!usuario) return;

      const nombre = document.getElementById("perf-nombre").value.trim();
      const fecha = document.getElementById("perf-fecha").value;

      if (!LugValidate.soloTexto(nombre)) {
        lugMostrarAlerta("alerta-perfil", "Ingresa un nombre válido.", "error");
        return;
      }
      if (!LugValidate.mayorDeEdad(fecha)) {
        lugMostrarAlerta("alerta-perfil", "Debes ser mayor de 18 años.", "error");
        return;
      }

      const checkboxes = document.querySelectorAll('input[name="pref-cat"]:checked');
      const favs = Array.from(checkboxes).map(c => c.value);

      const res = lugActualizarUsuario(usuario.email, {
        nombre,
        fechaNacimiento: fecha,
        preferencias: { categoriasFavoritas: favs }
      });

      if (res.ok) {
        lugMostrarAlerta("alerta-perfil", "¡Perfil actualizado con éxito!", "exito");
        setTimeout(renderizarCuenta, 1200);
      } else {
        lugMostrarAlerta("alerta-perfil", res.error, "error");
      }
    }

    function cerrarSesionMiCuenta() {
      lugCerrarSesion();
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
