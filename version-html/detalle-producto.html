<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de Producto — Level-Up Gamer</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-root="" data-page="productos">

  <header id="lug-header"></header>

  <main class="seccion">
    <div class="contenedor" id="detalle-contenedor">
      <!-- Carga dinámica del producto -->
      <div class="text-center" style="padding: 4rem 0;">
        <p>Cargando información del producto...</p>
      </div>
    </div>
  </main>

  <footer id="lug-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/validations.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/reviews.js"></script>
  <script src="js/nav.js"></script>

  <script>
    let productoActual = null;
    let cantidadSeleccionada = 1;

    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const codigo = params.get("codigo");

      if (!codigo) {
        mostrarError("No se especificó un producto.");
        return;
      }

      productoActual = lugGetProductByCode(codigo);
      if (!productoActual) {
        mostrarError("El producto solicitado no existe en nuestro catálogo.");
        return;
      }

      renderizarDetalle();
    });

    function mostrarError(msj) {
      const cont = document.getElementById("detalle-contenedor");
      cont.innerHTML = `
        <div class="resultado-vacio">
          <span style="font-size: 3rem; display: block;">⚠️</span>
          <h2>${msj}</h2>
          <a href="productos.html" class="btn btn-primary btn-sm" style="margin-top: 1rem;">Volver al Catálogo</a>
        </div>`;
    }

    function renderizarDetalle() {
      const p = productoActual;
      document.title = `${p.nombre} — Level-Up Gamer`;
      const promedioRating = lugPromedioCalificacion(p.codigo);
      const reviews = lugGetReviews(p.codigo);
      const precioDuoc = Math.round(p.precio * 0.8);

      const cont = document.getElementById("detalle-contenedor");
      cont.innerHTML = `
        <!-- Botón Volver -->
        <div style="margin-bottom: 1.5rem;">
          <a href="productos.html" class="btn btn-ghost btn-sm">&larr; Volver al catálogo</a>
        </div>

        <div class="detalle-grid">
          <!-- Imagen Principal -->
          <div class="detalle-imagen">
            ${lugRenderProductVisual(p, 'detalle-img')}
          </div>

          <!-- Información del Producto -->
          <div>
            <div style="display: flex; gap: 0.6rem; align-items: center; margin-bottom: 0.5rem; flex-wrap: wrap;">
              <span class="badge">📁 ${lugGetCategoryName(p.categoria)}</span>
              <span class="badge" style="background: rgba(57, 255, 20, 0.12); color: var(--verde); border-color: rgba(57, 255, 20, 0.35);">
                🏢 Origen: ${p.fabricante}
              </span>
            </div>

            <h1 style="margin-bottom: 0.4rem;">${p.nombre}</h1>
            <div style="color: var(--texto-tenue); font-size: 0.85rem; margin-bottom: 1rem;">Código: <code>${p.codigo}</code></div>

            <div style="display: flex; align-items: center; gap: 0.8rem; margin-bottom: 1.2rem;">
              <div class="producto-rating" style="font-size: 1.1rem;">
                ${lugRenderEstrellas(promedioRating)}
              </div>
              <span style="font-size: 0.9rem; color: var(--texto-secundario);">
                ${promedioRating.toFixed(1)} (${reviews.length} reseña${reviews.length === 1 ? "" : "s"})
              </span>
            </div>

            <!-- Precios -->
            <div style="background: var(--bg-tarjeta); border: 1px solid var(--borde); border-radius: var(--radio); padding: 1.2rem; margin-bottom: 1.5rem;">
              <div style="font-size: 0.85rem; color: var(--texto-tenue);">Precio Normal:</div>
              <div style="font-family: var(--fuente-titulo); font-size: 2rem; color: var(--azul);">${lugFormatCLP(p.precio)}</div>
              
              <div style="margin-top: 0.8rem; padding-top: 0.8rem; border-top: 1px dashed var(--borde-fuerte); display: flex; align-items: center; justify-content: space-between;">
                <div>
                  <span style="color: var(--verde); font-weight: 700; font-size: 0.9rem;">🎓 Precio Alumnos/Docentes Duoc (20% OFF):</span>
                  <div style="font-family: var(--fuente-titulo); font-size: 1.25rem; color: var(--verde);">${lugFormatCLP(precioDuoc)}</div>
                </div>
                <a href="registro.html" style="font-size: 0.8rem; color: var(--texto-tenue); text-decoration: underline;">Registrarse con Duoc</a>
              </div>
            </div>

            <p style="font-size: 1rem; line-height: 1.6; margin-bottom: 1.5rem;">${p.descripcion}</p>

            <!-- Dispo de Stock -->
            <div style="margin-bottom: 1.5rem;">
              <strong style="color: ${p.stock > 0 ? "var(--verde)" : "var(--error)"};">
                ${p.stock > 0 ? `✔ En Stock (${p.stock} unidades disponibles)` : "❌ Agotado temporalmente"}
              </strong>
            </div>

            <!-- Acciones de Compra -->
            ${p.stock > 0 ? `
              <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
                <div class="selector-cantidad">
                  <button type="button" onclick="cambiarCant(-1)">-</button>
                  <input type="number" id="cant-input" value="1" min="1" max="${p.stock}" readonly>
                  <button type="button" onclick="cambiarCant(1)">+</button>
                </div>
                <button type="button" onclick="agregarAlCarritoDetalle()" class="btn btn-accent" style="flex:1;">
                  🛒 Agregar al Carrito
                </button>
              </div>
            ` : `
              <button class="btn btn-outline btn-full" disabled>Sin Stock Disponible</button>
            `}
          </div>
        </div>

        <!-- Sección de Reseñas y Calificaciones -->
        <section style="margin-top: 4rem; padding-top: 3rem; border-top: 1px solid var(--borde);">
          <div class="seccion-titulo">
            <div>
              <h2>Reseñas y Calificaciones</h2>
              <p>Lee las experiencias de otros gamers o comparte tu opinión sobre este producto.</p>
            </div>
          </div>

          <div class="hero-grid" style="align-items: start; gap: 2.5rem;">
            <!-- Listado de Reseñas -->
            <div>
              <h3>Opiniones de Clientes</h3>
              <div id="lista-reviews" style="margin-top: 1rem;">
                ${reviews.length === 0 ? '<p style="color: var(--texto-tenue);">Aún no hay reseñas para este producto. ¡Sé el primero en opinar!</p>' : ''}
                ${reviews.map(r => `
                  <div class="review-item">
                    <div class="review-cabecera">
                      <span>👤 ${r.autor}</span>
                      <span class="review-estrellas">${lugRenderEstrellas(r.calificacion)}</span>
                    </div>
                    <div class="review-fecha">${new Date(r.fecha).toLocaleDateString("es-CL")}</div>
                    <p style="margin-top: 0.5rem; margin-bottom: 0;">${r.comentario}</p>
                  </div>
                `).join("")}
              </div>
            </div>

            <!-- Formulario para agregar Reseña -->
            <div class="tarjeta-formulario">
              <h3>Dejar una Reseña</h3>
              <form id="form-review" onsubmit="guardarResena(event)">
                <div class="campo">
                  <label for="rev-autor">Tu Nombre o GamerTag</label>
                  <input type="text" id="rev-autor" placeholder="Ej: ProGamer_CL" required>
                  <span class="mensaje-error" data-error-for="rev-autor"></span>
                </div>

                <div class="campo">
                  <label for="rev-rating">Calificación</label>
                  <select id="rev-rating" required>
                    <option value="5">★★★★★ (5 - Excelente)</option>
                    <option value="4">★★★★☆ (4 - Muy bueno)</option>
                    <option value="3">★★★☆☆ (3 - Regular)</option>
                    <option value="2">★★☆☆☆ (2 - Deficiente)</option>
                    <option value="1">★☆☆☆☆ (1 - Malo)</option>
                  </select>
                </div>

                <div class="campo">
                  <label for="rev-comentario">Tu Opinión o Comentario</label>
                  <textarea id="rev-comentario" rows="3" placeholder="¿Qué tal te pareció la calidad, rendimiento o empaque?" required style="width:100%; padding:0.8rem; background: rgba(255,255,255,0.05); border: 1px solid var(--borde-fuerte); border-radius: var(--radio-chico); color: var(--texto); font-family: var(--fuente-texto);"></textarea>
                  <span class="mensaje-error" data-error-for="rev-comentario"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Enviar Reseña 🌟</button>
              </form>
            </div>
          </div>
        </section>

        <!-- Productos Recomendados -->
        <section style="margin-top: 4rem;">
          <div class="seccion-titulo">
            <h2>Productos Relacionados</h2>
            <p>Otras opciones de la categoría ${lugGetCategoryName(p.categoria)} que te podrían interesar.</p>
          </div>
          <div class="productos-grid" id="productos-relacionados">
            <!-- Renderizado JS -->
          </div>
        </section>
      `;

      renderizarRelacionados();
    }

    function cambiarCant(delta) {
      const input = document.getElementById("cant-input");
      if (!input || !productoActual) return;
      let val = parseInt(input.value) + delta;
      if (val < 1) val = 1;
      if (val > productoActual.stock) val = productoActual.stock;
      input.value = val;
      cantidadSeleccionada = val;
    }

    function agregarAlCarritoDetalle() {
      if (!productoActual) return;
      const res = lugAgregarAlCarrito(productoActual.codigo, cantidadSeleccionada);
      if (res.ok) {
        alert(`¡Se agregaron ${cantidadSeleccionada} unidad(es) de ${productoActual.nombre} al carrito!`);
      } else {
        alert(res.error);
      }
    }

    function guardarResena(e) {
      e.preventDefault();
      const autor = document.getElementById("rev-autor").value.trim();
      const calificacion = document.getElementById("rev-rating").value;
      const comentario = document.getElementById("rev-comentario").value.trim();

      if (!LugValidate.requerido(autor) || !LugValidate.requerido(comentario)) {
        alert("Por favor completa tu nombre y comentario.");
        return;
      }

      const res = lugAgregarReview(productoActual.codigo, { autor, calificacion, comentario });
      if (res.ok) {
        alert("¡Muchas gracias! Tu reseña ha sido publicada con éxito.");
        renderizarDetalle();
      } else {
        alert(res.error);
      }
    }

    function renderizarRelacionados() {
      const relCont = document.getElementById("productos-relacionados");
      if (!relCont || !productoActual) return;

      const rels = lugGetProducts()
        .filter(p => p.categoria === productoActual.categoria && p.codigo !== productoActual.codigo)
        .slice(0, 4);

      if (rels.length === 0) {
        relCont.innerHTML = `<p style="color: var(--texto-tenue);">No hay otros productos en esta categoría por ahora.</p>`;
        return;
      }

      relCont.innerHTML = rels.map(p => `
        <div class="producto-card">
          <div class="producto-imagen">${lugRenderProductVisual(p)}</div>
          <div class="producto-info">
            <span class="producto-categoria">${lugGetCategoryName(p.categoria)}</span>
            <h3 class="producto-nombre">${p.nombre}</h3>
            <div class="producto-rating">${lugRenderEstrellas(lugPromedioCalificacion(p.codigo))} (${lugPromedioCalificacion(p.codigo)})</div>
            <div class="producto-precio">${lugFormatCLP(p.precio)}</div>
            <div class="producto-acciones">
              <a href="detalle-producto.html?codigo=${p.codigo}" class="btn btn-outline btn-sm" style="flex:1;">Ver Detalle</a>
            </div>
          </div>
        </div>
      `).join("");
    }
  </script>
</body>
</html>
