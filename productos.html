<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Productos — Level-Up Gamer</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-root="" data-page="productos">

  <header id="lug-header"></header>

  <main class="seccion">
    <div class="contenedor">
      <div class="seccion-titulo">
        <div>
          <h1>Catálogo Gamer</h1>
          <p>Explora nuestras 10 categorías de productos con garantía, autenticidad y despacho a todo Chile.</p>
        </div>
        <div id="cat-contador" class="badge">Cargando productos...</div>
      </div>

      <!-- Barra de Filtros Avanzados -->
      <div class="filtros-barra">
        <!-- Búsqueda por texto -->
        <div class="campo">
          <label for="filtro-buscar">🔍 Buscar producto</label>
          <input type="search" id="filtro-buscar" placeholder="Nombre, fabricante o código...">
        </div>

        <!-- Categoría -->
        <div class="campo">
          <label for="filtro-categoria">📁 Categoría</label>
          <select id="filtro-categoria">
            <option value="todas">Todas las categorías</option>
            <!-- Opciones inyectadas por JS -->
          </select>
        </div>

        <!-- Ordenamiento -->
        <div class="campo">
          <label for="filtro-orden">🔀 Ordenar por</label>
          <select id="filtro-orden">
            <option value="destacado">Recomendados</option>
            <option value="precio-asc">Precio: Menor a Mayor</option>
            <option value="precio-desc">Precio: Mayor a Menor</option>
            <option value="rating-desc">Mejor Calificación</option>
          </select>
        </div>

        <!-- Botón Limpiar -->
        <div style="margin-top: auto; padding-bottom: 0.2rem;">
          <button id="btn-limpiar-filtros" class="btn btn-outline btn-sm" type="button">Limpiar Filtros</button>
        </div>
      </div>

      <!-- Chips rápidos de categoría -->
      <div class="chip-grupo" id="cat-chips" style="margin-bottom: 2rem;">
        <!-- Inyectados por JS -->
      </div>

      <!-- Grilla de Productos -->
      <div class="productos-grid" id="grid-productos">
        <!-- Inyectados dinámicamente por JS -->
      </div>

      <!-- Estado vacío -->
      <div id="resultado-vacio" class="resultado-vacio" style="display: none;">
        <span style="font-size: 3rem; display: block; margin-bottom: 0.5rem;">🔎</span>
        <h3>No se encontraron productos</h3>
        <p>Intenta ajustar tus términos de búsqueda o selecciona otra categoría.</p>
        <button onclick="limpiarFiltros()" class="btn btn-primary btn-sm" style="margin-top: 1rem;">Restablecer Filtros</button>
      </div>
    </div>
  </main>

  <footer id="lug-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/validations.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/reviews.js"></script>
  <script src="js/nav.js"></script>

  <script>
    let catSeleccionada = "todas";

    document.addEventListener("DOMContentLoaded", () => {
      // Leer query param categoria si viene desde Home
      const params = new URLSearchParams(window.location.search);
      const catParam = params.get("categoria");
      if (catParam) catSeleccionada = catParam;

      inicializarFiltros();
      renderizarCatalogo();

      document.getElementById("filtro-buscar").addEventListener("input", renderizarCatalogo);
      document.getElementById("filtro-categoria").addEventListener("change", (e) => {
        catSeleccionada = e.target.value;
        actualizarChips();
        renderizarCatalogo();
      });
      document.getElementById("filtro-orden").addEventListener("change", renderizarCatalogo);
      document.getElementById("btn-limpiar-filtros").addEventListener("click", limpiarFiltros);
    });

    function inicializarFiltros() {
      // Poblar Select de categorías
      const sel = document.getElementById("filtro-categoria");
      LUG_CATEGORIES.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c.id;
        opt.textContent = `${c.icono} ${c.nombre}`;
        if (c.id === catSeleccionada) opt.selected = true;
        sel.appendChild(opt);
      });

      // Poblar Chips de categorías
      const chipsCont = document.getElementById("cat-chips");
      let html = `<button class="chip ${catSeleccionada === "todas" ? "activo" : ""}" onclick="seleccionarChip('todas')">Todas</button>`;
      LUG_CATEGORIES.forEach(c => {
        html += `<button class="chip ${catSeleccionada === c.id ? "activo" : ""}" onclick="seleccionarChip('${c.id}')">${c.icono} ${c.nombre}</button>`;
      });
      chipsCont.innerHTML = html;
    }

    function seleccionarChip(catId) {
      catSeleccionada = catId;
      document.getElementById("filtro-categoria").value = catId;
      actualizarChips();
      renderizarCatalogo();
    }

    function actualizarChips() {
      const chips = document.querySelectorAll(".chip");
      chips.forEach(c => {
        const isSelected = (c.textContent.trim() === "Todas" && catSeleccionada === "todas") ||
                           c.getAttribute("onclick").includes(`'${catSeleccionada}'`);
        c.classList.toggle("activo", isSelected);
      });
    }

    function limpiarFiltros() {
      document.getElementById("filtro-buscar").value = "";
      document.getElementById("filtro-categoria").value = "todas";
      document.getElementById("filtro-orden").value = "destacado";
      catSeleccionada = "todas";
      actualizarChips();
      renderizarCatalogo();
    }

    function renderizarCatalogo() {
      const q = document.getElementById("filtro-buscar").value.trim().toLowerCase();
      const orden = document.getElementById("filtro-orden").value;
      let productos = lugGetProducts();

      // Filtrar por categoría
      if (catSeleccionada !== "todas") {
        productos = productos.filter(p => p.categoria === catSeleccionada);
      }

      // Filtrar por texto
      if (q) {
        productos = productos.filter(p => 
          p.nombre.toLowerCase().includes(q) ||
          p.codigo.toLowerCase().includes(q) ||
          p.descripcion.toLowerCase().includes(q) ||
          p.fabricante.toLowerCase().includes(q)
        );
      }

      // Ordenar
      if (orden === "precio-asc") {
        productos.sort((a, b) => a.precio - b.precio);
      } else if (orden === "precio-desc") {
        productos.sort((a, b) => b.precio - a.precio);
      } else if (orden === "rating-desc") {
        productos.sort((a, b) => b.rating - a.rating);
      }

      // Contador
      const contador = document.getElementById("cat-contador");
      contador.textContent = `${productos.length} producto${productos.length === 1 ? "" : "s"} disponible${productos.length === 1 ? "" : "s"}`;

      // Grilla
      const grid = document.getElementById("grid-productos");
      const vacio = document.getElementById("resultado-vacio");

      if (productos.length === 0) {
        grid.style.display = "none";
        vacio.style.display = "block";
      } else {
        grid.style.display = "grid";
        vacio.style.display = "none";

        grid.innerHTML = productos.map(p => `
          <div class="producto-card">
            <div class="producto-imagen">${p.icono}</div>
            <div class="producto-info">
              <span class="producto-categoria">${lugGetCategoryName(p.categoria)} • ${p.fabricante}</span>
              <h3 class="producto-nombre">${p.nombre}</h3>
              <div class="producto-rating">
                ${lugRenderEstrellas(p.rating)} (${p.rating})
              </div>
              <div class="producto-precio">${lugFormatCLP(p.precio)}</div>
              <div class="producto-stock">Stock disponible: ${p.stock} un.</div>
              <div class="producto-acciones">
                <a href="detalle-producto.html?codigo=${p.codigo}" class="btn btn-outline btn-sm" style="flex:1;">Ver Detalle</a>
                <button onclick="catalogoAgregar('${p.codigo}')" class="btn btn-primary btn-sm" type="button" title="Agregar al Carrito">🛒 Agregar</button>
              </div>
            </div>
          </div>
        `).join("");
      }
    }

    function catalogoAgregar(codigo) {
      const res = lugAgregarAlCarrito(codigo, 1);
      if (res.ok) {
        alert("¡Producto agregado al carrito exitosamente!");
      } else {
        alert(res.error);
      }
    }
  </script>
</body>
</html>
