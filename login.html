<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — Level-Up Gamer</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-root="" data-page="login">

  <header id="lug-header"></header>

  <main class="seccion">
    <div class="contenedor-angosto">
      <div class="text-center" style="margin-bottom: 2rem;">
        <h1>Iniciar Sesión</h1>
        <p>Accede a tu cuenta para gestionar tus pedidos, acumular puntos y canjear tus beneficios gamer.</p>
      </div>

      <div class="tarjeta-formulario">
        <!-- Alerta de estado -->
        <div id="alerta-login" class="alerta"></div>

        <form id="form-login" novalidate>
          <!-- Email -->
          <div class="campo">
            <label for="login-email">Correo Electrónico *</label>
            <input type="email" id="login-email" placeholder="ejemplo@duocuc.cl" required>
            <span class="mensaje-error" data-error-for="login-email"></span>
          </div>

          <!-- Contraseña -->
          <div class="campo">
            <label for="login-pass">Contraseña *</label>
            <input type="password" id="login-pass" placeholder="••••••••" required>
            <span class="mensaje-error" data-error-for="login-pass"></span>
          </div>

          <button type="submit" class="btn btn-primary btn-full" style="margin-top: 1rem;">Entrar a Mi Cuenta 🎮</button>
        </form>

        <div class="separador-o">O USA UNA CUENTA DE PRUEBA RÁPIDA (DEMO)</div>

        <div style="display: flex; flex-direction: column; gap: 0.6rem;">
          <button type="button" onclick="loginDemoDuoc()" class="btn btn-outline btn-sm">
            🎓 Demo: Usuario Duoc (20% OFF de por vida)
          </button>
          <button type="button" onclick="loginDemoNormal()" class="btn btn-outline btn-sm">
            🎮 Demo: Usuario Normal con 150 Puntos LevelUp
          </button>
        </div>

        <div class="separador-o">¿NO TIENES CUENTA?</div>

        <div class="text-center">
          <a href="registro.html" class="btn btn-accent btn-full">Crear Cuenta Nueva</a>
        </div>
      </div>
    </div>
  </main>

  <footer id="lug-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/validations.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/reviews.js"></script>
  <script src="js/nav.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get("registrado") === "true") {
        lugMostrarAlerta("alerta-login", "¡Cuenta creada exitosamente! Ahora puedes iniciar sesión.", "exito");
      }

      document.getElementById("form-login").addEventListener("submit", (e) => {
        e.preventDefault();

        lugSetFieldError("login-email", "");
        lugSetFieldError("login-pass", "");

        const email = document.getElementById("login-email").value.trim();
        const pass = document.getElementById("login-pass").value;

        let valido = true;
        if (!LugValidate.email(email)) {
          lugSetFieldError("login-email", "Ingresa un correo electrónico válido.");
          valido = false;
        }
        if (!LugValidate.requerido(pass)) {
          lugSetFieldError("login-pass", "Ingresa tu contraseña.");
          valido = false;
        }

        if (!valido) return;

        const res = lugIniciarSesion(email, pass);
        if (res.ok) {
          lugMostrarAlerta("alerta-login", `¡Bienvenido de nuevo, ${res.usuario.nombre}!`, "exito");
          setTimeout(() => {
            window.location.href = "mi-cuenta.html";
          }, 1200);
        } else {
          lugMostrarAlerta("alerta-login", res.error, "error");
        }
      });
    });

    // Funciones demo para agilizar revisión docente
    function loginDemoDuoc() {
      const users = lugGetUsers();
      let user = users.find(u => u.email.toLowerCase() === "alumno.demo@duocuc.cl");
      if (!user) {
        const res = lugRegistrarUsuario({
          nombre: "Estudiante Duoc UC",
          email: "alumno.demo@duocuc.cl",
          fechaNacimiento: "2000-05-15",
          password: "password123",
          codigoReferido: ""
        });
        user = res.usuario;
      }
      lugIniciarSesion(user.email, "password123");
      window.location.href = "mi-cuenta.html";
    }

    function loginDemoNormal() {
      const users = lugGetUsers();
      let user = users.find(u => u.email.toLowerCase() === "gamer.demo@gmail.com");
      if (!user) {
        const res = lugRegistrarUsuario({
          nombre: "Gamer Leyenda",
          email: "gamer.demo@gmail.com",
          fechaNacimiento: "1998-10-20",
          password: "password123",
          codigoReferido: ""
        });
        user = res.usuario;
        user.puntosLevelUp = 150; // darle puntos demo para canjear
        lugActualizarUsuario(user.email, { puntosLevelUp: 150 });
      }
      lugIniciarSesion(user.email, "password123");
      window.location.href = "mi-cuenta.html";
    }
  </script>
</body>
</html>
