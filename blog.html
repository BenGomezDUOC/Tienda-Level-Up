<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog y Guías Gamer — Level-Up Gamer</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-root="" data-page="blog">

  <header id="lug-header"></header>

  <main class="seccion">
    <div class="contenedor">
      <div class="seccion-titulo">
        <div>
          <h1>Blog y Comunidad Gamer</h1>
          <p>Novedades, consejos de expertos y guías prácticas para mejorar tu experiencia de juego.</p>
        </div>
      </div>

      <!-- Grilla de Artículos -->
      <div class="blog-grid" id="blog-grid-posts">
        <!-- Renderizado dinámicamente vía JS -->
      </div>
    </div>
  </main>

  <!-- Modal para lectura de artículo completo (Detalles de Blog) -->
  <div class="modal-fondo" id="modal-blog">
    <div class="modal-caja" style="width: min(720px, 100%);">
      <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 0.5rem;">
        <span id="modal-blog-icono" style="font-size: 2.5rem;"></span>
        <button onclick="cerrarModalBlog()" class="btn btn-ghost btn-sm" style="font-size: 1.2rem;" type="button">✕</button>
      </div>
      <div id="modal-blog-img-container" style="margin-bottom: 1.2rem; display: none;">
        <img id="modal-blog-img" src="" alt="" style="width: 100%; max-height: 300px; object-fit: cover; border-radius: var(--radio-chico); border: 1px solid var(--borde);" />
      </div>
      <div id="modal-blog-meta" class="blog-meta"></div>
      <h2 id="modal-blog-titulo" style="margin-bottom: 1rem;"></h2>
      <div id="modal-blog-contenido" class="blog-contenido" style="line-height: 1.7; color: var(--texto-secundario);"></div>
      
      <!-- Compartir en redes sociales (Requisito del caso) -->
      <div style="margin-top: 2rem; padding-top: 1.2rem; border-top: 1px solid var(--borde); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.8rem;">
        <span style="font-size: 0.85rem; color: var(--texto-tenue);">Compartir este artículo:</span>
        <div style="display: flex; gap: 0.5rem;">
          <button onclick="compartirArticulo('twitter')" class="btn btn-outline btn-sm">🐦 X / Twitter</button>
          <button onclick="compartirArticulo('facebook')" class="btn btn-outline btn-sm">📘 Facebook</button>
          <button onclick="compartirArticulo('whatsapp')" class="btn btn-outline btn-sm">💬 WhatsApp</button>
        </div>
      </div>

      <div style="margin-top: 1.5rem; text-align: right;">
        <button onclick="cerrarModalBlog()" class="btn btn-primary btn-sm" type="button">Cerrar Artículo</button>
      </div>
    </div>
  </div>

  <footer id="lug-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/validations.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/reviews.js"></script>
  <script src="js/nav.js"></script>

  <script>
    let postActual = null;

    document.addEventListener("DOMContentLoaded", () => {
      renderizarBlog();

      // Si viene por query param ?id=bp001, abrir modal directamente
      const params = new URLSearchParams(window.location.search);
      const idParam = params.get("id");
      if (idParam) {
        abrirModalBlog(idParam);
      }
    });

    function renderizarBlog() {
      const grid = document.getElementById("blog-grid-posts");
      grid.innerHTML = LUG_BLOG_POSTS.map(post => `
        <div class="blog-card">
          <div class="blog-imagen">
            ${post.imagen ? `<img src="${post.imagen}" alt="${post.titulo}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><span class="fallback-icono" style="display:none; font-size: 3rem;">${post.icono}</span>` : `<span style="font-size: 3rem;">${post.icono}</span>`}
          </div>
          <div class="blog-info">
            <div class="blog-meta">📅 ${post.fecha} • ✍️ ${post.autor}</div>
            <h3>${post.titulo}</h3>
            <p>${post.resumen}</p>
            <button onclick="abrirModalBlog('${post.id}')" class="btn btn-outline btn-sm btn-full" type="button" style="margin-top: 0.8rem;">
              Leer Artículo Completo 📖
            </button>
          </div>
        </div>
      `).join("");
    }

    function abrirModalBlog(id) {
      const post = LUG_BLOG_POSTS.find(p => p.id === id);
      if (!post) return;

      postActual = post;
      document.getElementById("modal-blog-icono").textContent = post.icono;
      document.getElementById("modal-blog-meta").textContent = `Publicado el ${post.fecha} por ${post.autor}`;
      document.getElementById("modal-blog-titulo").textContent = post.titulo;
      document.getElementById("modal-blog-contenido").textContent = post.contenido;

      const imgCont = document.getElementById("modal-blog-img-container");
      const modalImg = document.getElementById("modal-blog-img");
      if (imgCont && modalImg) {
        if (post.imagen) {
          modalImg.src = post.imagen;
          modalImg.alt = post.titulo;
          imgCont.style.display = "block";
        } else {
          imgCont.style.display = "none";
        }
      }

      const modal = document.getElementById("modal-blog");
      modal.classList.add("visible");
    }

    function cerrarModalBlog() {
      const modal = document.getElementById("modal-blog");
      modal.classList.remove("visible");
    }

    function compartirArticulo(red) {
      if (!postActual) return;
      const url = encodeURIComponent(window.location.href);
      const texto = encodeURIComponent(`¡Lee este artículo de Level-Up Gamer: "${postActual.titulo}"!`);

      if (red === "twitter") {
        window.open(`https://twitter.com/intent/tweet?text=${texto}&url=${url}`, "_blank");
      } else if (red === "facebook") {
        window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, "_blank");
      } else if (red === "whatsapp") {
        window.open(`https://wa.me/?text=${texto}%20${url}`, "_blank");
      }
    }
  </script>
</body>
</html>
